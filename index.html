<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>high score: <span id="high-score">0</span></h3>
                    
                </div>
                 <div class="info">
                    <h3> score:<span id="score">0</span></h3>
                    
                </div>
                 <div class="info">
                    <h3>time: <span id="time">00-00</span></h3>
                   
                </div>
            </div>
            <div class="board">
               
            </div>
        </section>
        <div class="modal">
            <div class="start">
                <h3>Welcome to Suraj Snake game</h3>
                <button class="btn btn-start">Start game</button>
            </div>
            <div class="game-over">
                <h3>Game over</h3>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>
</body>
  <script src="script.js" defer></script>
</html>
